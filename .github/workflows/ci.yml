name: CI

on:
  pull_request:
  push:
    branches: [main]
  deployment_status:

permissions:
  contents: read

jobs:
  checks:
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholder: the build loads server code, but nothing connects to a database in CI
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run check
      - run: bun run lint
      - name: Install Chromium for component tests
        run: bunx playwright install --with-deps chromium
      - name: Unit and component tests
        run: bunx vitest run
      - run: bun run build

  e2e:
    if: github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx playwright install --with-deps chromium
      - name: End-to-end tests against the Vercel deployment
        run: |
          if [ -z "$PLAYWRIGHT_BASE_URL" ]; then
            echo "::error::Vercel did not report a deployment URL"
            exit 1
          fi
          bunx playwright test
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.environment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
